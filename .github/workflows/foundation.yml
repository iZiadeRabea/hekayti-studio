name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-05
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 resolved 2026-10-06
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install locked application test dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test foundation
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Health (offline remote checks)
        shell: pwsh
        run: ./scripts/health-check.ps1 -Offline
